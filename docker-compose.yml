services:
  postgres:
    image: postgres:16-alpine
    container_name: marketworld-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketworld}
      POSTGRES_USER: ${POSTGRES_USER:-marketworld}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketworld}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-marketworld} -d $${POSTGRES_DB:-marketworld}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: marketworld-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
